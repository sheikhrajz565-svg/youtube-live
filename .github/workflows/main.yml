name: YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video
        run: |
          mkdir -p media
          # এখানে তোমার ভিডিওটা repo তে থাকলে: cp path/to/video.mp4 media/input.mp4
          # অথবা সরাসরি লিংক দিয়ে নামাবে:
          curl -L "${{ secrets.VIDEO_URL }}" -o media/input.mp4

      - name: Stream to YouTube (Loop)
        env:
          RTMP_URL: ${{ secrets.YOUTUBE_RTMP_URL }}
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 -i media/input.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "${RTMP_URL}/${STREAM_KEY}"
